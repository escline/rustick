[package]
name = "rustick"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustick"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
chrono = { version = "0.4", features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
winreg = "0.10"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"    # optimize for size, not speed
lto = true         # remove dead code across all crates
codegen-units = 1  # single unit allows better cross-function optimization
panic = "abort"    # drop panic unwinding machinery
strip = true       # strip debug symbols from the binary
